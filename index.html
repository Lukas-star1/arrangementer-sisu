<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrangementer</title>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; cursor:none; overflow:hidden; font-family:Calibri,"Segoe UI",Arial,sans-serif; }
  body { background:#4f72c2; background:radial-gradient(ellipse 70% 30% at 50% 62%, #e3c97a, rgba(227,201,122,0) 70%), #4f72c2; }
  body.off { background:#000; }
  body.off #app { display:none; }
  #app { height:100%; padding:2vw 3vw; }
  .title { margin:2vw 0 7vw; border:.25vw solid rgba(255,255,255,.7); border-radius:4vw;
    background:rgba(255,255,255,.08); text-align:center; color:#fff; font-weight:700; font-size:8vw; padding:4vw 2vw; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th { background:#4f72c2; color:#fff; text-align:left; font-size:5.2vw; padding:1.4vw 1.6vw;
    border:0 solid #fff; border-right-width:.3vw; border-bottom-width:.6vw; }
  td { color:#3b57a7; font-weight:700; font-size:4.6vw; padding:2vw 1.6vw; vertical-align:top;
    border-right:.2vw solid #fff; white-space:pre-line; word-wrap:break-word; }
  tbody tr.odd td { background:#d0d5e8; }
  tbody tr.even td { background:#e9ebf5; }
  col.c1{width:44%} col.c2{width:28%} col.c3{width:17%} col.c4{width:11%}
  td.kl { text-align:center; }
  tfoot td { background:#d0d5e8; font-size:3.8vw; }
  tfoot td.note { color:#3cae4a; font-size:4.2vw; }
  #logo { display:block; margin:6vw auto 0; max-width:45vw; max-height:14vh; }
  #status { position:fixed; right:2vw; bottom:1vw; font-size:2vw; color:rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="app">
  <div class="title" id="title">Arrangementer 2026</div>
  <table>
    <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
    <thead><tr><th>Arrangementer</th><th>Dato</th><th>KL</th><th></th></tr></thead>
    <tbody id="body"><tr class="odd"><td colspan="4">Henter data...</td></tr></tbody>
    <tfoot><tr><td id="legend"></td><td class="note" id="note" colspan="3"></td></tr></tfoot>
  </table>
  <img id="logo" src="logo.png" alt="" onerror="this.style.display='none'">
</div>
<div id="status"></div>

<script>
/* ====== INDSTILLINGER – ret kun her ====== */
var TITLE = "Arrangementer 2026";
var DATA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxU70GEoYORBDG-Wu3zuABUxCjapp2lWAYlOz4_qdYHgfDF5M4DOaH-8gRyPHht5fsCi4jV_ggWB5A/pubhtml?gid=1001&single=true";
var SCHEDULE_CSV_URL = "";   // valgfri fane: Dag | Tænd | Sluk
var DEFAULT_HOURS = {
  0: ["09:00","22:00"], 1: ["09:00","22:00"], 2: ["09:00","22:00"],
  3: ["09:00","22:00"], 4: ["09:00","22:00"], 5: ["09:00","22:00"], 6: ["09:00","22:00"]
};
var REFRESH_SECONDS = 60;
/* ========================================= */

var VERSION = "v2";
var DAYS = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
var hours = DEFAULT_HOURS, rows = null;
function $(id){ return document.getElementById(id); }
$("title").innerHTML = TITLE;

function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function restore(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

function parseCSV(text){
  var out=[], row=[], cur="", q=false, i, c;
  for (i=0;i<text.length;i++){
    c=text.charAt(i);
    if (q){
      if (c==='"' && text.charAt(i+1)==='"'){ cur+='"'; i++; }
      else if (c==='"'){ q=false; }
      else cur+=c;
    }
    else if (c==='"') q=true;
    else if (c===','){ row.push(cur); cur=""; }
    else if (c==='\n' || c==='\r'){
      if (c==='\r' && text.charAt(i+1)==='\n') i++;
      row.push(cur); out.push(row); row=[]; cur="";
    }
    else cur+=c;
  }
  if (cur!=="" || row.length){ row.push(cur); out.push(row); }
  return out;
}

function getCSV(url, ok, fail){
  var x = new XMLHttpRequest();
  x.open("GET", url + (url.indexOf("?")>-1 ? "&" : "?") + "t=" + new Date().getTime(), true);
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300){
      try{ ok(parseCSV(x.responseText)); }catch(e){ fail("parse"); }
    } else { fail(x.status || "net"); }
  };
  try{ x.send(); }catch(e){ fail("send"); }
}

function esc(s){
  return String(s==null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function toMin(t){ var m=/(\d{1,2})[:.](\d{2})/.exec(t||""); return m ? (+m[1])*60+(+m[2]) : null; }
function parseDate(s){
  var m=/(\d{1,4})[-.\/](\d{1,2})[-.\/](\d{1,4})/.exec(s||""); if(!m) return null;
  return m[1].length===4 ? new Date(+m[1],+m[2]-1,+m[3]) : new Date(+m[3],+m[2]-1,+m[1]);
}
function isOn(){
  var h=hours[new Date().getDay()]; if(!h) return false;
  var d=new Date(), n=d.getHours()*60+d.getMinutes();
  return n>=toMin(h[0]) && n<toMin(h[1]);
}

function render(){
  if(!rows || rows.length<2) return;
  var today=new Date(); today.setHours(0,0,0,0);
  var visible=[], i, r, d, html="";
  for (i=1;i<rows.length;i++){
    r=rows[i];
    if(!(r[0]||"").replace(/\s/g,"")) continue;
    d=parseDate(r[4]);
    if(d && d<today) continue;
    visible.push(r);
  }
  for (i=0;i<visible.length;i++){
    r=visible[i];
    html+='<tr class="'+(i%2?"even":"odd")+'"><td>'+esc(r[0])+'</td><td>'+esc((r[1]||"").replace(/\s*\/\s*/g,"\n"))+
          '</td><td class="kl">'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>';
  }
  $("body").innerHTML = html;
  $("legend").innerHTML = esc(rows[1][6]||"");
  $("note").innerHTML = esc(rows[1][7]||"");
}

function loadSchedule(){
  if(!SCHEDULE_CSV_URL) return;
  getCSV(SCHEDULE_CSV_URL, function(r){
    var h={}, i, k;
    for(i=0;i<7;i++) h[i]=null;
    for(i=1;i<r.length;i++){
      k=DAYS.indexOf((r[i][0]||"").replace(/^\s+|\s+$/g,"").toLowerCase());
      if(k>-1 && toMin(r[i][1])!==null && toMin(r[i][2])!==null) h[k]=[r[i][1],r[i][2]];
    }
    hours=h; store("hours",h);
  }, function(){ hours = restore("hours") || DEFAULT_HOURS; });
}

function loadData(){
  getCSV(DATA_CSV_URL, function(r){
    rows=r; store("rows",r); $("status").innerHTML=""; render();
  }, function(err){
    if(!rows) rows=restore("rows");
    if(rows){ render(); $("status").innerHTML="Offline - viser seneste data ("+err+") "+VERSION; }
    else { $("body").innerHTML='<tr class="odd"><td colspan="4">Kunne ikke hente data (fejl: '+esc(err)+')</td></tr>'; $("status").innerHTML=VERSION; }
  });
}

function tick(){
  if(isOn()) document.body.className=""; else document.body.className="off";
}

loadSchedule(); loadData(); tick();
setInterval(tick, 60000);
setInterval(function(){ loadSchedule(); loadData(); }, REFRESH_SECONDS*1000);
setInterval(function(){ var d=new Date(); if(d.getHours()===4 && d.getMinutes()===0) location.reload(); }, 60000);
</script>
</body>
</html>
