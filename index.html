<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrangementer</title>
<style>
  :root { --blue:#4f72c2; --text:#3b57a7; --row1:#d0d5e8; --row2:#e9ebf5; --green:#3cae4a; --gold:#e3c97a; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; cursor:none; overflow:hidden; font-family:Calibri,"Segoe UI",Arial,sans-serif; }
  body { background:radial-gradient(ellipse 70% 30% at 50% 62%, var(--gold), transparent 70%), var(--blue); }
  body.off { background:#000; }
  body.off #app { display:none; }
  #app { height:100%; padding:2vw 3vw; display:flex; flex-direction:column; }
  .title { margin:2vw 0 7vw; border:.25vw solid rgba(255,255,255,.7); border-radius:4vw;
    background:rgba(255,255,255,.08); text-align:center; color:#fff; font-weight:700; font-size:8vw; padding:4vw 2vw; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th { background:var(--blue); color:#fff; text-align:left; font-size:5.2vw; padding:1.4vw 1.6vw;
    border:.3vw solid #fff; border-width:0 .3vw .6vw 0; }
  td { color:var(--text); font-weight:700; font-size:4.6vw; padding:2vw 1.6vw; vertical-align:top;
    border-right:.2vw solid #fff; white-space:pre-line; overflow-wrap:anywhere; }
  tbody tr:nth-child(odd) td { background:var(--row1); }
  tbody tr:nth-child(even) td { background:var(--row2); }
  col.c1{width:44%} col.c2{width:28%} col.c3{width:17%} col.c4{width:11%}
  td.kl { text-align:center; }
  tfoot td { background:var(--row1); font-size:3.8vw; }
  tfoot td.note { color:var(--green); font-size:4.2vw; }
  #logo { margin:auto auto 3vw; max-width:45vw; max-height:14vh; }
  #status { position:fixed; right:1vw; bottom:.5vw; font-size:1.4vw; color:rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="app">
  <div class="title" id="title">Arrangementer 2026</div>
  <table>
    <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
    <thead><tr><th>Arrangementer</th><th>Dato</th><th>KL</th><th></th></tr></thead>
    <tbody id="body"></tbody>
    <tfoot><tr><td id="legend"></td><td class="note" id="note" colspan="3"></td></tr></tfoot>
  </table>
  <img id="logo" src="logo.png" alt="" onerror="this.style.display='none'">
</div>
<div id="status"></div>

<script>
/* ====== INDSTILLINGER – ret kun her ====== */
const TITLE = "Arrangementer 2026";

// Google Sheets: Filer > Del > Udgiv på nettet > vælg fanen > CSV > kopiér linket hertil
const DATA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxU70GEoYORBDG-Wu3zuABUxCjapp2lWAYlOz4_qdYHgfDF5M4DOaH-8gRyPHht5fsCi4jV_ggWB5A/pub?gid=1001&single=true&output=csv";

// (Valgfri) Fane med kolonnerne: Dag | Tænd | Sluk  (fx "mandag | 16:00 | 22:00"). Tom = brug DEFAULT_HOURS.
const SCHEDULE_CSV_URL = "";

// Dag 0 = søndag ... 6 = lørdag. null = slukket hele dagen.
const DEFAULT_HOURS = {
  0: ["00:00","23:59"], 1: ["00:00","23:59"], 2: ["00:00","23:59"],
  3: ["00:00","23:59"], 4: ["00:00","23:59"], 5: ["00:00","23:59"], 6: ["00:00","23:59"]
};
const REFRESH_SECONDS = 60;
/* ========================================= */

const DAYS = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
let hours = DEFAULT_HOURS, rows = null;
document.getElementById("title").textContent = TITLE;

function parseCSV(text){
  const out=[]; let row=[], cur="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'&&text[i+1]==='"'){cur+='"';i++;} else if(c==='"'){q=false;} else cur+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(cur); cur=""; }
    else if (c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); out.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if (cur!==""||row.length){ row.push(cur); out.push(row); }
  return out;
}
async function getCSV(url){
  const r = await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return parseCSV(await r.text());
}
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toMin = t => { const m=/(\d{1,2})[:.](\d{2})/.exec(t||""); return m?(+m[1])*60+(+m[2]):null; };

// Læser 2026-11-29, 29-11-2026, 29.11.2026 eller 29/11/2026
function parseDate(s){
  const m=/(\d{1,4})[-./](\d{1,2})[-./](\d{1,4})/.exec(s||""); if(!m) return null;
  return m[1].length===4 ? new Date(+m[1],+m[2]-1,+m[3]) : new Date(+m[3],+m[2]-1,+m[1]);
}

function isOn(){
  const h=hours[new Date().getDay()]; if(!h) return false;
  const d=new Date(), n=d.getHours()*60+d.getMinutes();
  return n>=toMin(h[0]) && n<toMin(h[1]);
}

function render(){
  if(!rows) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const data=rows.slice(1).filter(r=>(r[0]||"").trim());
  const visible=data.filter(r=>{ const d=parseDate(r[4]); return !d || d>=today; });
  document.getElementById("body").innerHTML = visible.map(r=>
    `<tr><td>${esc(r[0])}</td><td>${esc((r[1]||"").replace(/\s*\/\s*/g,"\n"))}</td>`+
    `<td class="kl">${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("");
  const first=rows[1]||[];
  document.getElementById("legend").textContent = first[6]||"";
  document.getElementById("note").textContent = first[7]||"";
}

async function loadSchedule(){
  if(!SCHEDULE_CSV_URL) return;
  try{
    const h={}; DAYS.forEach((_,i)=>h[i]=null);
    (await getCSV(SCHEDULE_CSV_URL)).slice(1).forEach(r=>{
      const i=DAYS.indexOf((r[0]||"").trim().toLowerCase());
      if(i>=0&&toMin(r[1])!==null&&toMin(r[2])!==null) h[i]=[r[1],r[2]];
    });
    hours=h; localStorage.setItem("hours",JSON.stringify(h));
  }catch(e){ try{ hours=JSON.parse(localStorage.getItem("hours"))||DEFAULT_HOURS; }catch(_){} }
}
async function loadData(){
  try{ rows=await getCSV(DATA_CSV_URL); localStorage.setItem("rows",JSON.stringify(rows)); document.getElementById("status").textContent=""; }
  catch(e){ if(!rows){ try{ rows=JSON.parse(localStorage.getItem("rows")); }catch(_){} } document.getElementById("status").textContent="offline"; }
  render();
}
const tick=()=>{ document.body.classList.toggle("off",!isOn()); render(); };

(async()=>{
  await loadSchedule(); await loadData(); tick();
  setInterval(tick,60000);
  setInterval(async()=>{ await loadSchedule(); await loadData(); tick(); },REFRESH_SECONDS*1000);
  setInterval(()=>{ const d=new Date(); if(d.getHours()===4&&d.getMinutes()===0) location.reload(); },60000);
})();
</script>
</body>
</html>
